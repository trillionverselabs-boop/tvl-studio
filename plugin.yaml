name: example-plugin
version: "0.1.0"
manifest_version: 1
kind: standalone
requires_hermes: ">=0.23.0"
author: LeMultiFox
license: MIT
homepage: https://github.com/trillionverselabs-boop/example-plugin
tags: [template]
description: >-
  A minimal Hermes plugin that is already shaped the way the catalog review wants
  it: agent tools with JSON-error boundaries, a profile-scoped data dir, a desktop
  page built only from the SDK, and the disclosure docs written. Rename it and
  replace the example tool with the real one.
provides_tools:
  - example_echo
# No `capabilities:` block: this plugin asks the host for nothing special. Declare
# one only for a door you actually use (e.g. preview.executeJavaScript) — catalog
# rule 06 fails the entry when declared capabilities do not match `register()`.
# No `python_dependencies` either: pydantic/fastapi are Hermes core requirements,
# and a non-empty dependency list makes the desktop's non-interactive install stop
# at a consent prompt it cannot answer.
