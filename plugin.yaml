name: tvl-studio
version: "0.1.0"
manifest_version: 1
kind: standalone
requires_hermes: ">=0.23.0"
author: Trillionverse Labs
license: MIT
homepage: https://github.com/trillionverselabs-boop/tvl-studio
tags: [video, storyboard, tts, hyperframes, tvl]
description: >-
  Script in, film out: import a script, get a storyboard, generate images with
  your agent, record multi-character voiceovers, and render a finished video.
  Brand kits apply one branding across images, video, voices and music.
provides_tools:
  - studio_import_script
  - studio_list
  - studio_status
  - studio_attach_image
  - studio_attach_portrait
  - studio_voiceover
  - studio_assemble
  - studio_brands
# No `capabilities:` block — the plugin asks the host for nothing privileged.
# Images are generated by the agent's own image_generate tool (host-owned
# credentials); this plugin never reads keys or calls image APIs itself.
# No `python_dependencies` — stdlib + host packages only.
